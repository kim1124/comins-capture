name: Verify

on:
  pull_request:
  push:
    branches: [codex-governance-v111, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Sensitive data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_ARCHIVE: gitleaks_8.30.1_linux_x64.tar.gz
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Resolve reviewed range and validate identities
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
            head_sha="$HEAD_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            node scripts/check-public-identities.mjs "$head_sha"
            range="$head_sha"
          else
            node scripts/check-public-identities.mjs "$base_sha" "$head_sha"
            range="$base_sha..$head_sha"
          fi
          printf 'REVIEW_RANGE=%s\n' "$range" >> "$GITHUB_ENV"
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive_path=$(mktemp "${RUNNER_TEMP}/comins-gitleaks.XXXXXX.tar.gz")
          trap 'rm -f "$archive_path"' EXIT
          curl --fail --silent --show-error --location \
            --output "$archive_path" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive_path" | sha256sum --check --status
          install -d .local/bin
          tar -xzf "$archive_path" -C .local/bin gitleaks
          test "$(.local/bin/gitleaks version)" = "$GITLEAKS_VERSION"
      - name: Scan reviewed commits and current tree
        shell: bash
        run: |
          set -euo pipefail
          if ! .local/bin/gitleaks git --config .gitleaks.toml \
            --log-opts="$REVIEW_RANGE" --ignore-gitleaks-allow \
            --redact --no-banner --no-color --log-level error >/dev/null 2>&1; then
            printf '%s\n' 'sensitive-data-check: failed' >&2
            exit 1
          fi
          tree_dir=$(mktemp -d "${RUNNER_TEMP}/comins-capture-tree.XXXXXX")
          trap 'rm -rf "$tree_dir"' EXIT
          git archive HEAD | tar -x -C "$tree_dir"
          if ! .local/bin/gitleaks dir "$tree_dir" --config .gitleaks.toml \
            --ignore-gitleaks-allow --redact --no-banner --no-color --log-level error >/dev/null 2>&1; then
            printf '%s\n' 'sensitive-data-check: failed' >&2
            exit 1
          fi
      - name: Validate detector behavior
        env:
          GITLEAKS_BIN: .local/bin/gitleaks
        run: node --test test/security/*.test.mjs
      - name: Check diff hygiene
        run: git diff --check "$REVIEW_RANGE"

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
